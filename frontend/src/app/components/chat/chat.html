<div class="chat-container">
  <div class="chat-header">
    <button class="btn-back" (click)="goBack()">← Back</button>
    <h2>{{ documentName() }}</h2>
    <button class="btn-clear" (click)="clearChat()">🗑️ Clear</button>
  </div>

  <div class="messages" #messagesContainer>
    @if (messages().length === 0) {
      <div class="empty-chat">
        <p>💬 Ask a question about this document</p>
      </div>
    }

    @for (msg of messages(); track $index) {
      <div [ngClass]="'message message-' + msg.role">
        <div class="message-content">
          <div class="message-text">{{ msg.content }}</div>
          <div class="message-time">{{ msg.timestamp | date: 'short' }}</div>
        </div>
      </div>
    }

    @if (loading()) {
      <div class="message message-loading">
        <div class="message-content">
          <div class="spinner"></div>
          <div class="message-text">Thinking...</div>
        </div>
      </div>
    }
  </div>

  <div class="input-area">
    <input
      [ngModel]="question()"
      (ngModelChange)="question.set($event)"
      (keyup.enter)="askQuestion()"
      [disabled]="loading()"
      placeholder="Ask a question about this document..."
      class="input-field"
    />
    <button
      (click)="askQuestion()"
      [disabled]="loading() || !question().trim()"
      class="btn-send"
    >
      {{ loading() ? '⏳' : '➤' }}
    </button>
  </div>
</div>
